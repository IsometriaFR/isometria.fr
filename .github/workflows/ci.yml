name: CI

# Quality gate sur chaque pull request et sur main :
# format (Prettier) → lint (ESLint) → types (astro check) → build → Lighthouse.
# Sur une PR, une fois le gate passé, une URL d'aperçu est publiée en commentaire.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types + build (astro check, astro build)
        run: npm run build

      - name: Lighthouse CI (mobile, médiane de 3 passes)
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Rapports Lighthouse
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore

  preview:
    name: Aperçu Cloudflare (PR)
    needs: quality
    # Seulement pour les PR du dépôt lui-même (pas les forks) et une fois Cloudflare configuré.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (préprod)
        run: npm run build
        env:
          CLOUDFLARE_ENV: preprod

      - name: Upload d'une version d'aperçu (sans la déployer)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" \
            | tee upload.log
          url=$(grep -oE 'https://pr-[a-z0-9.-]+\.workers\.dev' upload.log | head -n1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Commentaire avec l'URL d'aperçu
        if: steps.upload.outputs.url != ''
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        with:
          script: |
            const marker = '<!-- cloudflare-preview -->';
            const body = `${marker}\n**Aperçu Cloudflare** : ${process.env.PREVIEW_URL}\n\nCommit \`${context.sha.slice(0, 7)}\` (build préprod, non indexé).`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
