version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # TypeScript 7 n'est pas encore accepté par @astrojs/check (^5 || ^6)
      # ni par typescript-eslint (< 6.1) : le groupe échoue sinon. À retirer
      # quand ces deux paquets le supporteront.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
