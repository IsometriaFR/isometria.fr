<!doctype html>
<!-- @dsCard group="Type" name="Type · Display specimen" subtitle="Kreon 48 with sauge accent" viewport="700x170" -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Type — IBM Plex Sans display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 16px; background: var(--color-background); }
  .card { box-sizing: border-box; width: 668px; padding: 26px 28px; background: var(--color-surface); border: 0.5px solid var(--color-border); border-radius: 10px; }
  .spec { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; color: var(--color-text); letter-spacing: -0.02em; font-size: 48px; line-height: 1.05; margin: 0 0 14px; }
  .accent { color: var(--color-primary); font-weight: 600; }
  .meta { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--color-text-soft); display: flex; gap: 16px; }
  .meta span b { color: var(--color-text); font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="spec">Le web <span class="accent">artisanal</span>, avec des racines.</div>
  <div class="meta">
    <span><b>IBM Plex Sans</b> 600</span>
    <span>48 / 1.05</span>
    <span>tracking −0.02em</span>
    <span>accent: teal-600 · 600</span>
  </div>
</div>
</body>
</html>
