<!doctype html>
<!-- @dsCard group="Colors" name="Color · Teal sauge" subtitle="Primary palette — 10 stops" viewport="700x200" -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Teal sauge scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 16px; background: var(--color-background); font-family: var(--font-sans); }
  .card { box-sizing: border-box; width: 668px; padding: 22px 24px; background: var(--color-surface); border: 0.5px solid var(--color-border); border-radius: 10px; }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
  .swatch { aspect-ratio: 1 / 1.25; border-radius: 8px; border: 0.5px solid var(--color-border); display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 7px; font-family: "JetBrains Mono", monospace; font-size: 9.5px; color: var(--color-cream-900); }
  .swatch.dark { color: var(--color-cream-100); }
  .stop { opacity: 0.85; }
  .hex { font-weight: 500; letter-spacing: -0.01em; }
  h4 { margin: 0 0 14px; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 16px; color: var(--color-text); letter-spacing: -0.005em; }
  .caption { font-size: 11.5px; color: var(--color-text-soft); margin-top: 12px; }
  .caption b { color: var(--color-primary); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h4>Teal sauge — 10 stops</h4>
  <div class="row">
    <div class="swatch" style="background:#F0F5F4"><div class="stop">50</div><div class="hex">F0F5F4</div></div>
    <div class="swatch" style="background:#DCE9E7"><div class="stop">100</div><div class="hex">DCE9E7</div></div>
    <div class="swatch" style="background:#B9D3D0"><div class="stop">200</div><div class="hex">B9D3D0</div></div>
    <div class="swatch" style="background:#8FB8B3"><div class="stop">300</div><div class="hex">8FB8B3</div></div>
    <div class="swatch dark" style="background:#5A9792"><div class="stop">400</div><div class="hex">5A9792</div></div>
    <div class="swatch dark" style="background:#3D807A"><div class="stop">500</div><div class="hex">3D807A</div></div>
    <div class="swatch dark" style="background:#2E6F6A"><div class="stop">600</div><div class="hex">2E6F6A</div></div>
    <div class="swatch dark" style="background:#265A56"><div class="stop">700</div><div class="hex">265A56</div></div>
    <div class="swatch dark" style="background:#1B4441"><div class="stop">800</div><div class="hex">1B4441</div></div>
    <div class="swatch dark" style="background:#10302D"><div class="stop">900</div><div class="hex">10302D</div></div>
  </div>
  <p class="caption"><b>teal-600</b> est la couleur primaire — boutons, liens, accents typographiques.</p>
</div>
</body>
</html>
