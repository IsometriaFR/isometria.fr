<!doctype html>
<!-- @dsCard group="UI Kit — Sebc" name="UI kit · sebc.dev" subtitle="Studio site — home / services / journal / article" viewport="1040x820" -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Isometria · UI kit — studio site</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #FEFDF9; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Services.jsx"></script>
<script type="text/babel" src="Journal.jsx"></script>
<script type="text/babel" src="Article.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    const [view, setView] = useState(() => localStorage.getItem("sebc_view") || "home");
    useEffect(() => { localStorage.setItem("sebc_view", view); }, [view]);

    return (
      <div data-screen-label={`sebc.dev · ${view}`}>
        <Header current={view} onNavigate={setView} />
        {view === "home" && (
          <>
            <Hero onCta={() => setView("services")} />
            <Stats />
            <Services />
          </>
        )}
        {view === "services" && <Services />}
        {view === "journal" && <Journal onOpen={() => setView("article")} />}
        {view === "article" && <Article />}
        <Footer />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
