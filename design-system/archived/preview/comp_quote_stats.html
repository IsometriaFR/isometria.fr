<!doctype html>
<!-- @dsCard group="Components" name="Quote & stats" subtitle="Blockquote · Kreon stat numbers" viewport="700x220" -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Quote & stat</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 16px; background: var(--color-background); font-family: "Nunito Sans", sans-serif; }
  .card { box-sizing: border-box; width: 668px; padding: 24px 26px; background: #FFFFFE; border: 0.5px solid #F1EDE0; border-radius: 10px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: center; }
  blockquote { margin: 0; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 22px; line-height: 1.3; color: #2B2D2B; letter-spacing: -0.01em; border-left: 2px solid #2E6F6A; padding-left: 14px; }
  blockquote cite { display: block; font-family: "Nunito Sans", sans-serif; font-weight: 400; font-style: normal; font-size: 12px; color: #6B6B62; margin-top: 10px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .num { font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 32px; color: #2E6F6A; line-height: 1; letter-spacing: -0.015em; }
  .lbl { font-size: 12px; color: #6B6B62; }
</style>
</head>
<body>
<div class="card">
  <blockquote>
    Un site qui charge vite, que mes clients comprennent, et que je peux faire évoluer seul.
    <cite>— Amélie Rouvière, Le Pain des Glycines</cite>
  </blockquote>
  <div class="stats">
    <div class="stat"><span class="num">7 ans</span><span class="lbl">d'indépendance</span></div>
    <div class="stat"><span class="num">24</span><span class="lbl">sites livrés</span></div>
    <div class="stat"><span class="num">100&nbsp;%</span><span class="lbl">statique</span></div>
    <div class="stat"><span class="num">4–6</span><span class="lbl">semaines par projet</span></div>
  </div>
</div>
</body>
</html>
