<!-- @dsCard group="Components" name="Form inputs" subtitle="Default · focused · error" width=700 height=250 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Inputs</title>
<style>
  html, body { margin: 0; padding: 16px; background: var(--color-background); font-family: "Nunito Sans", sans-serif; }
  .card { box-sizing: border-box; width: 668px; padding: 22px 24px; background: #FFFFFE; border: 0.5px solid #F1EDE0; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 12px; font-weight: 500; color: #2B2D2B; }
  .hint { font-size: 11.5px; color: #6B6B62; }
  .input { background: #FFFFFF; border: 0.5px solid #DCD6C4; border-radius: 7px; padding: 9px 12px; font: 400 14px "Nunito Sans", sans-serif; color: #2B2D2B; }
  .input.focused { border: 1px solid #2E6F6A; outline: none; box-shadow: 0 0 0 3px rgba(46, 111, 106, 0.12); }
  .input.error { border: 1px solid #A32D2D; }
  .input::placeholder { color: #ADA896; }
  .err { font-size: 11.5px; color: #A32D2D; }
  h4 { grid-column: 1 / -1; margin: 0; font-family: "IBM Plex Sans", sans-serif; font-weight: 600; font-size: 16px; color: #2B2D2B; letter-spacing: -0.005em; }
</style>
</head>
<body>
<div class="card">
  <h4>Champs de formulaire</h4>
  <div class="field">
    <label class="label">Nom</label>
    <input class="input" placeholder="Prénom Nom">
  </div>
  <div class="field">
    <label class="label">Email</label>
    <input class="input focused" value="hello@atelier.fr">
  </div>
  <div class="field">
    <label class="label">Téléphone</label>
    <input class="input" value="06 12 34 56 78">
    <span class="hint">Optionnel — je rappelle sous 48 h.</span>
  </div>
  <div class="field">
    <label class="label">Budget estimé</label>
    <input class="input error" value="abc">
    <span class="err">Valeur numérique requise.</span>
  </div>
</div>
</body>
</html>
