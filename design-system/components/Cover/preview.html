<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cover</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--color-background); }
  .cover { position: relative; width: 960px; height: 336px; overflow: hidden; background: var(--color-background); }
  .cover svg { position: absolute; left: 0; top: 0; }
  .blk { rx: var(--radius-lg); }
  .teal600 { fill: var(--color-teal-600); }
  .teal900 { fill: var(--color-teal-900); }
  .teal200 { fill: var(--color-teal-200); }
  .ink900 { fill: var(--color-cream-900); }
  .hex { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .hex.cut { stroke: var(--color-cream-200); }
  .hex.ink { stroke: var(--color-teal-600); }
  .edge { fill: none; stroke-width: 0.9; stroke-linecap: round; }
  .edge.cut { stroke: var(--color-cream-200); }
  .edge.ink { stroke: var(--color-teal-600); }
  .name { position: absolute; left: 24px; top: 160px; font-family: var(--font-serif); font-weight: var(--fw-medium); font-size: 64px; line-height: 0.95; letter-spacing: var(--ls-display); color: var(--color-text); white-space: nowrap; }
  .tagline { position: absolute; left: 24px; top: 290px; max-width: 440px; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--color-text-soft); }
</style>
</head>
