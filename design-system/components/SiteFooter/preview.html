<!-- @dsCard group="Site" name="Pied de page et indice de défilement" subtitle="JetBrains Mono 12 px, filet de 1 px" width=700 height=210 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pied de page et indice de défilement</title>
<style>
  html, body { margin: 0; padding: 16px; background: var(--color-background, #FEFDF9); }
  .frame { box-sizing: border-box; width: 668px; max-width: 100%; border: 0.5px solid var(--color-border-strong, #DCD6C4); border-radius: 7px; background: var(--color-background, #FEFDF9); }
  .hint-zone { padding: 24px; }
  .scroll-hint { font: 500 12px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-soft, #6B6B62); display: flex; align-items: center; gap: 10px; }
  .scroll-hint i { display: block; width: 1px; height: 28px; background: var(--color-line, #CBC6B5); position: relative; overflow: hidden; }
  .scroll-hint i::after { content: ""; position: absolute; left: 0; top: -10px; width: 1px; height: 10px; background: var(--color-primary, #2E6F6A); animation: hint 1.8s ease-in-out infinite; }
  @keyframes hint { to { top: 28px; } }
  @media (prefers-reduced-motion: reduce) { .scroll-hint i::after { animation: none; top: 9px; } }
  .foot { border-top: 1px solid var(--color-line-faint, #E2DED1); padding: 26px 24px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font: 500 12px/1.4 "JetBrains Mono", ui-monospace, monospace; color: var(--color-text-soft, #6B6B62); letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="frame">
  <div class="hint-zone"><span class="scroll-hint"><i></i>Faites tourner le cube</span></div>
  <footer class="foot"><span>© 2026 ISOMETRIA</span><span>SITES · OUTILS INTERNES · IA</span></footer>
</div>
</body>
</html>
